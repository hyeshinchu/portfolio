  - title: "Emergence of Scaling in Random Networks (Barabási-Albert model)"
    no_image: true
    paper: "https://arxiv.org/abs/cond-mat/9910332"
    demo: "/assets/playground/emergence-of-scaling/"
    demo_inline: true
    detail: >
      <p>Barabási and Albert's 1999 paper showed that many real-world networks — the web, citation networks, actor collaborations — aren't wired randomly. They grow over time, and new nodes preferentially connect to nodes that are already well-connected. These two ingredients, growth and preferential attachment, are enough to produce scale-free networks: a handful of highly connected hubs and a power-law degree distribution P(k) ~ k<sup>-3</sup>, with no hub deliberately designed.</p>

      <p>I built the simulation below to see this emerge myself — growing a network node by node under preferential attachment versus plain random attachment, and watching the degree distribution bend into a power law (a straight line on a log-log plot) only in the preferential-attachment case.</p>
    tags:
      - Network Science
      - Complex Systems
      - Paper Review
    description: >-
      Reviewing the paper that introduced scale-free networks, and building an interactive simulation to watch preferential attachment create hubs in real time
  - title: "Collective Dynamics of 'Small-World' Networks (Watts-Strogatz model)"
    no_image: true
    paper: "https://www.nature.com/articles/30918"
    demo: "/assets/playground/collective-dynamics-small-world/"
    demo_inline: true
    detail: >
      <p>Watts and Strogatz's 1998 paper started from a regular ring lattice, where every node connects only to its nearest neighbors — highly clustered, but far apart. Rewiring each local edge to a random node with probability p interpolates toward a random graph. The surprise: even a tiny amount of rewiring collapses the average path length almost to the random-graph level while the clustering coefficient barely drops, so a network can be highly clustered and a "small world" at the same time.</p>

      <p>I built the simulation below to see this myself — rewiring an illustrative ring lattice at a chosen p, and tracking where that p falls on the clustering-coefficient and path-length curves computed from a larger reference network, reproducing the shape of the paper's central figure.</p>
    tags:
      - Network Science
      - Complex Systems
      - Paper Review
    description: >-
      Reviewing the paper that introduced small-world networks, and building an interactive simulation to watch clustering and path length diverge as a ring lattice is randomly rewired
  - title: "On Random Graphs I (Erdős-Rényi model)"
    no_image: true
    paper: "https://bpb-us-e1.wpmucdn.com/campuspress-test.yale.edu/dist/6/2449/files/2018/02/Erdos-Renyi-1n0pskh.pdf"
    demo: "/assets/playground/on-random-graphs/"
    demo_inline: true
    detail: >
      <p>Erdős and Rényi's 1959 paper asked three questions about a graph formed by connecting n labelled points at random: what is the probability it's completely connected, how big is its largest connected component, and how many connected components does it have? Answering these revealed one of the most influential results in network science — as the average number of connections per node (c) crosses 1, the graph undergoes a sudden phase transition from many small, disconnected fragments into a single "giant component" that swallows almost every node.</p>

      <p>I built the simulation below to see this threshold myself — adding random edges to a network and watching the largest connected component suddenly take over as c passes 1, tracked against a reference curve computed from a larger network.</p>
    tags:
      - Network Science
      - Complex Systems
      - Paper Review
    description: >-
      Reviewing the paper that introduced random graphs, and building an interactive simulation to watch a giant connected component suddenly emerge as edges are added
